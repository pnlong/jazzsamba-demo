<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore — JazzSAMBA</title>
  <link rel="icon" href="img/favicon/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="img/favicon/site.webmanifest" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/explorer.css" />
</head>
<body class="explorer-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">Jazz<span>SAMBA</span></a>
      <nav class="nav" aria-label="Primary">
        <a data-page="home" href="index.html">Home</a>
        <a data-page="explore" href="explore.html">Explore</a>
        <a data-page="about" href="about.html">About</a>
        <a data-page="band" href="band.html">The Band</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="explorer-layout">
      <aside class="explorer-sidebar">
        <div>
          <label for="protocol-filter">Protocol</label>
          <select id="protocol-filter">
            <option value="all">All</option>
            <option value="async">Asynchronous</option>
            <option value="sync">Synchronous</option>
          </select>
        </div>
        <div>
          <label for="song-search">Search</label>
          <input id="song-search" type="search" placeholder="Title, artist, id…" />
        </div>
        <ul class="song-list" id="song-list"></ul>
      </aside>

      <section class="explorer-main">
        <div class="explorer-toolbar">
          <h2 id="song-title">Loading…</h2>
          <div id="song-meta" class="muted"></div>
          <div class="transport" id="transport">
            <button type="button" id="play-pause-btn" class="transport-btn" title="Play" aria-label="Play">
              <svg class="transport-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="transport-icon-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
            </button>
            <button type="button" id="stop-btn" class="transport-btn" title="Stop" aria-label="Stop">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6V6z"/></svg>
            </button>
            <button type="button" id="follow-playhead-btn" class="transport-btn is-active" title="Following playhead" aria-label="Following playhead" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v8H11z"/><path d="M8 14l4 5 4-5z"/></svg>
            </button>
            <input id="seek" type="range" min="0" max="1000" value="0" />
            <span id="time-display">0:00 / 0:00</span>
          </div>
        </div>

        <div id="timeline-editor">
          <div id="waveform-wrap">
            <canvas id="waveform" height="96"></canvas>
            <div id="playhead" class="playhead"></div>
          </div>
          <div id="lanes-panel">
            <div id="lanes"></div>
          </div>
        </div>
        <p class="explorer-status" id="explorer-status"></p>
      </section>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <footer class="site-footer">
    Mix-only explorer · stems in the dataset download
  </footer>

  <script src="js/site.js"></script>
  <script src="js/metrical.js"></script>
  <script src="js/explorer.js"></script>
</body>
</html>
