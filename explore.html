<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore — JazzSAMBA</title>
  <link rel="icon" href="img/favicon/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="img/favicon/site.webmanifest" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/explorer.css" />
</head>
<body class="explorer-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">Jazz<span>SAMBA</span></a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v2H4V7zm0 4h16v2H4v-2zm0 4h16v2H4v-2z"/></svg>
      </button>
      <nav class="nav" id="site-nav" aria-label="Primary">
        <a data-page="home" href="index.html">Home</a>
        <a data-page="explore" href="explore.html">Explore</a>
        <a data-page="about" href="about.html">About</a>
        <a data-page="band" href="band.html">The Band</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="explorer-layout">
      <aside class="explorer-sidebar">
        <div class="sidebar-search-row">
          <label class="visually-hidden" for="song-search">Search songs</label>
          <input id="song-search" type="search" placeholder="Title, artist, id…" />
          <button
            type="button"
            id="filter-open-btn"
            class="filter-open-btn"
            aria-haspopup="dialog"
            aria-controls="filter-modal"
            aria-expanded="false"
          >
            Filters
          </button>
        </div>
        <p class="song-list-label" id="song-list-count"></p>
        <ul class="song-list" id="song-list"></ul>
      </aside>

      <section class="explorer-main">
        <div class="explorer-toolbar">
          <h2 id="song-title">Loading…</h2>
          <div id="song-meta" class="muted"></div>
          <div class="transport" id="transport">
            <button type="button" id="play-pause-btn" class="transport-btn" title="Play" aria-label="Play">
              <svg class="transport-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="transport-icon-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
            </button>
            <button type="button" id="stop-btn" class="transport-btn" title="Stop" aria-label="Stop">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6V6z"/></svg>
            </button>
            <button type="button" id="follow-playhead-btn" class="transport-btn is-active" title="Following playhead" aria-label="Following playhead" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v8H11z"/><path d="M8 14l4 5 4-5z"/></svg>
            </button>
            <button type="button" id="metronome-btn" class="transport-btn" title="Metronome off" aria-label="Metronome off" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2l6 18H6L12 2zm0 5.5L8.6 18h6.8L12 7.5z"/>
                <path d="M11 10h2v5h-2z"/>
                <circle cx="12" cy="17.5" r="1.2"/>
              </svg>
            </button>
            <input id="seek" type="range" min="0" max="1000" value="0" />
            <span id="time-display">0:00 / 0:00</span>
          </div>
        </div>

        <div id="timeline-editor">
          <div id="waveform-wrap">
            <canvas id="waveform" height="96"></canvas>
            <div id="playhead" class="playhead"></div>
          </div>
          <div id="lanes-panel">
            <div id="lanes"></div>
          </div>
        </div>
        <p class="explorer-status" id="explorer-status"></p>
      </section>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <div id="filter-modal" class="filter-modal" hidden role="dialog" aria-modal="true" aria-labelledby="filter-modal-title">
    <button type="button" class="filter-modal-backdrop" id="filter-modal-backdrop" aria-label="Close filters"></button>
    <div class="filter-modal-panel">
      <div class="filter-modal-header">
        <h2 id="filter-modal-title">Filters</h2>
        <button type="button" class="filter-modal-close" id="filter-modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="filter-modal-body">
        <div class="filter-group">
          <p class="filter-group-label">Recording</p>
          <div class="filter-field">
            <label for="protocol-filter">Protocol</label>
            <select id="protocol-filter">
              <option value="all">All</option>
              <option value="async">Asynchronous</option>
              <option value="sync">Synchronous</option>
            </select>
          </div>
          <div class="filter-field">
            <div class="musician-filter-head">
              <span class="filter-field-title">Musicians</span>
              <label class="check-inline">
                <input type="checkbox" id="musician-select-all" checked />
                Select all
              </label>
            </div>
            <div id="musician-checkboxes" class="musician-checkboxes"></div>
          </div>
        </div>
        <div class="filter-group">
          <p class="filter-group-label">Repertoire</p>
          <div class="filter-field">
            <label for="genre-filter">Genre</label>
            <select id="genre-filter">
              <option value="all">All</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="form-filter">Form</label>
            <select id="form-filter">
              <option value="all">All</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="key-filter">Key</label>
            <select id="key-filter">
              <option value="all">All</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="time-filter">Time signature</label>
            <select id="time-filter">
              <option value="all">All</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="swung-filter">Rhythm</label>
            <select id="swung-filter">
              <option value="all">All</option>
              <option value="True">Swung</option>
              <option value="False">Straight</option>
            </select>
          </div>
        </div>
      </div>
      <div class="filter-modal-footer">
        <button type="button" class="filter-reset" id="filter-reset">Reset filters</button>
        <button type="button" class="btn btn-primary filter-done-btn" id="filter-modal-done">Done</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    Mix-only explorer · stems in the dataset download
  </footer>

  <script src="js/site.js"></script>
  <script src="js/metrical.js"></script>
  <script src="js/metronome.js"></script>
  <script src="js/explorer.js"></script>
</body>
</html>
